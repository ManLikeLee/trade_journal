version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    # 5 saturated both ecosystems immediately and silently queued the rest —
    # including a Next.js security update that never surfaced as a PR.
    open-pull-requests-limit: 10
    groups:
      # One PR for patch/minor bumps keeps the noise down; majors stay separate
      # so they get read properly.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # 5 saturated both ecosystems immediately and silently queued the rest —
    # including a Next.js security update that never surfaced as a PR.
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
