name: CI

# Runs on every pull request and every push to main. This is the gate that was
# absent when the audit was written: nothing verified that the application built,
# type-checked or linted, so nothing noticed when it stopped working.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      # The Prisma client is generated code that the type-checker needs; without
      # this, tsc fails on a clean checkout.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Compiling is what proves the artefact the Dockerfile runs actually
      # exists. `npm start` points at dist/server.js.
      - name: Build
        run: npm run build

      # Wired up and currently a no-op. Task H4 replaces the script body with a
      # real suite; the step exists now so adding tests needs no CI change.
      - name: Test
        run: npm test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # The single strongest check that the app is shippable: it compiles every
      # route, which typechecking alone does not do.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Building the images is what would have caught C5: the backend Dockerfile
  # invokes a deleted NestJS entry point and the frontend Dockerfile copies a
  # standalone output that is never produced.
  #
  # ⚠️ NON-BLOCKING ON PURPOSE. The frontend image does not build today, and C5 —
  # which fixes it — was descoped because this project runs without Docker. Left
  # blocking, CI would be permanently red and everyone would stop reading it.
  # Remove continue-on-error the moment C5 lands; until then this reports the
  # breakage without hiding it.
  docker:
    name: Docker images (non-blocking until C5)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
